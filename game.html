<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Dash V2</title><style>*{box-sizing:border-box}body{margin:0;background:#070b19;color:#eaf5ff;font-family:system-ui;display:flex;min-height:100dvh;align-items:center;justify-content:center;overflow:hidden}#wrap{width:min(100vw,520px);padding:12px;text-align:center}h1{margin:2px 0;color:#55f5e8;letter-spacing:3px;text-shadow:0 0 15px #1de8db}.panel{display:flex;justify-content:space-between;font-weight:800;margin:8px 5px;color:#b6caff;gap:5px}canvas{width:100%;height:min(64vh,590px);border:2px solid #2b3e78;border-radius:18px;background:#101a38;touch-action:none;box-shadow:0 0 22px #172b68}button{background:#22e6d5;color:#07101e;border:0;border-radius:10px;padding:10px 13px;font-size:15px;font-weight:850;margin:5px 3px}button.secondary{background:#222e59;color:#dce8ff;border:1px solid #5268a5}button.active{outline:2px solid #fff;box-shadow:0 0 10px currentColor}#controls{display:flex;justify-content:center;flex-wrap:wrap}small{display:block;color:#9aa8c9;margin-top:4px}</style></head><body><div id="wrap"><h1>NEON DASH <span style="font-size:12px;color:#ff4fbd">V2</span></h1><div class="panel"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span><span>🪙 <b id="coins">0</b></span></div><canvas id="game" width="420" height="680"></canvas><div id="controls"><button id="start">PLAY</button><button class="secondary" id="sound">🔊 Sound ON</button></div><div id="skins"><button class="secondary skin active" data-skin="cyan">CYAN</button><button class="secondary skin" data-skin="pink">PINK</button><button class="secondary skin" data-skin="gold">GOLD</button></div><small>Tap to jump • Collect coins • Avoid neon blocks</small></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),coinEl=document.getElementById('coins');const colors={cyan:'#39f6dc',pink:'#ff4fbd',gold:'#ffd34d'};let best=+(localStorage.nd2best||0),wallet=+(localStorage.nd2coins||0),skin=localStorage.nd2skin||'cyan',soundOn=localStorage.nd2sound!=='off',score=0,playing=false,over=false,player={x:72,y:530,w:34,h:42,vy:0},obs=[],coins=[],speed=4,frame=0,coinCount=0,audioCtx=null;bestEl.textContent=best;coinEl.textContent=wallet;
function tone(freq=650,dur=.09,type='sine',vol=.04){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function reset(){score=0;coinCount=0;speed=4;frame=0;obs=[];coins=[];player.y=530;player.vy=0;playing=true;over=false;document.getElementById('start').textContent='RESTART';scoreEl.textContent='0';coinEl.textContent=wallet;loop()}
function jump(){if(!playing){reset();return}if(player.y>=530){player.vy=-13.5;tone(520,.07,'square',.025)}}
document.getElementById('start').onclick=reset;c.addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});document.getElementById('sound').onclick=()=>{soundOn=!soundOn;localStorage.nd2sound=soundOn?'on':'off';document.getElementById('sound').textContent=soundOn?'🔊 Sound ON':'🔇 Sound OFF';if(soundOn)tone(700,.06)};document.getElementById('sound').textContent=soundOn?'🔊 Sound ON':'🔇 Sound OFF';document.querySelectorAll('.skin').forEach(b=>{b.classList.toggle('active',b.dataset.skin===skin);b.onclick=()=>{skin=b.dataset.skin;localStorage.nd2skin=skin;document.querySelectorAll('.skin').forEach(x=>x.classList.toggle('active',x===b));tone(850,.05)}});
function draw(){ctx.clearRect(0,0,420,680);let grd=ctx.createLinearGradient(0,0,0,680);grd.addColorStop(0,'#101b3a');grd.addColorStop(1,'#080b1b');ctx.fillStyle=grd;ctx.fillRect(0,0,420,680);for(let i=0;i<42;i++){let x=(i*73+frame*.22)%420,y=(i*137)%490;ctx.fillStyle='rgba(130,190,255,.45)';ctx.fillRect(x,y,2,2)}ctx.strokeStyle='#1e4770';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,572);ctx.lineTo(420,572);ctx.stroke();ctx.strokeStyle='rgba(49,234,222,.18)';for(let i=0;i<9;i++){let x=(i*55-frame*speed)%500;ctx.beginPath();ctx.moveTo(x,572);ctx.lineTo(x-70,680);ctx.stroke()}
// runner body
ctx.shadowColor=colors[skin];ctx.shadowBlur=18;ctx.fillStyle=colors[skin];ctx.fillRect(player.x,player.y,player.w,player.h);ctx.shadowBlur=0;ctx.fillStyle='#09233a';ctx.fillRect(player.x+8,player.y+9,5,5);ctx.fillRect(player.x+22,player.y+9,5,5);ctx.fillStyle='#fff';ctx.fillRect(player.x+11,player.y+28,13,3);
obs.forEach(o=>{ctx.shadowColor='#ff3d83';ctx.shadowBlur=15;ctx.fillStyle='#ff3d83';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.shadowBlur=0;ctx.fillStyle='#4c0c38';ctx.fillRect(o.x+5,o.y+5,o.w-10,o.h-10)});coins.forEach(k=>{ctx.shadowColor='#ffd34d';ctx.shadowBlur=14;ctx.strokeStyle='#ffd34d';ctx.lineWidth=4;ctx.beginPath();ctx.arc(k.x,k.y,10,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#ffeaa0';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText('$',k.x,k.y+4)});
if(!playing){ctx.fillStyle='#eaf5ff';ctx.textAlign='center';ctx.font='bold 30px system-ui';ctx.fillText(over?'GAME OVER':'READY?',210,285);ctx.font='17px system-ui';ctx.fillText(over?'Tap PLAY to run again':'Press PLAY or tap to begin',210,320);if(over){ctx.font='bold 18px system-ui';ctx.fillStyle='#ffd34d';ctx.fillText('Run score: '+score+'  •  Coins: '+coinCount,210,355)}}}
function loop(){if(!playing){draw();return}frame++;player.vy+=.62;player.y+=player.vy;if(player.y>530){player.y=530;player.vy=0}if(frame%78===0){let h=35+Math.random()*45;obs.push({x:430,y:572-h,w:25+Math.random()*18,h})}if(frame%95===0){coins.push({x:445,y:480-Math.random()*100})}obs.forEach(o=>o.x-=speed);coins.forEach(k=>k.x-=speed);obs=obs.filter(o=>o.x+o.w>0);coins=coins.filter(k=>k.x>-20);score++;speed=Math.min(8,speed+.0018);scoreEl.textContent=Math.floor(score/5);
let got=coins.findIndex(k=>Math.abs(k.x-(player.x+player.w/2))<23&&Math.abs(k.y-(player.y+player.h/2))<26);if(got>=0){coins.splice(got,1);coinCount++;wallet++;localStorage.nd2coins=wallet;coinEl.textContent=wallet;tone(1000,.12,'sine',.05)}let hit=obs.some(o=>player.x<o.x+o.w&&player.x+player.w>o.x&&player.y<o.y+o.h&&player.y+player.h>o.y);if(hit){playing=false;over=true;score=Math.floor(score/5);if(score>best){best=score;localStorage.nd2best=best;bestEl.textContent=best}tone(150,.25,'sawtooth',.04);draw();return}draw();requestAnimationFrame(loop)}draw();
</script></body></html>
